; Two firmware variants share one core (include/core + src/core: BLE input,
; protocols, BridgeCore, FTMS output, ConfigStore/NVS, commands, Serial console).
; Exactly one variant flag per environment (include/variant.h enforces it):
;   esp32s3dev   -DSF_VARIANT_WEB  Wi-Fi + web UI + REST/WebSocket API
;   crowpanel128 -DSF_VARIANT_HMI  local LVGL HMI on the ELECROW CrowPanel 1.28"
[platformio]
default_envs = esp32s3dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; Pinned for Arduino-ESP32 core 2.0.17 (NimBLE 2.x needs core 3.x).
lib_deps =
    symlink:///tmp/pio-libs/NimBLE-Arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Iinclude/core
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; BLE: FTMS output client + BLE input device (+1 spare) on one NimBLE stack.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
build_src_filter = +<main.cpp> +<core/>

; Web variant: ESP32-S3 DevKitC-1 N16R8 (16 MB QIO flash, 8 MB octal PSRAM).
[env:esp32s3dev]
board = esp32-s3-devkitc-1
lib_deps =
    ${env.lib_deps}
    symlink:///tmp/pio-libs/ArduinoJson
    symlink:///tmp/pio-libs/AsyncTCP
    symlink:///tmp/pio-libs/ESPAsyncWebServer
extra_scripts = pre:scripts/embed_web_assets.py
build_flags =
    ${env.build_flags}
    -Iinclude/variants/web
    -DSF_VARIANT_WEB
build_src_filter = ${env.build_src_filter} +<variants/web/>

; HMI variant: ELECROW CrowPanel 1.28" ESP32-S3 Rotary Display (ESP32-S3R8:
; 8 MB in-package octal PSRAM, 16 MB flash). ELECROW's Arduino settings for this
; board: "ESP32S3 Dev Module", QIO flash, OPI PSRAM, 16 MB, USB "Hardware CDC
; and JTAG" -> same memory_type/partitions/USB flags as the shared [env].
; No Wi-Fi/web server in this variant.
[env:crowpanel128]
board = esp32-s3-devkitc-1
; The CrowPanel's only USB-C port is the S3's native USB-Serial/JTAG
; (/dev/ttyACM*). esptool's switch to 921600 there can fail with
; "No serial data received"; the baud rate does not limit USB-JTAG throughput.
upload_speed = 115200
lib_deps =
    ${env.lib_deps}
    symlink:///tmp/pio-libs/lvgl
    symlink:///tmp/pio-libs/LovyanGFX
    symlink:///tmp/pio-libs/Adafruit_NeoPixel
build_flags =
    ${env.build_flags}
    -Iinclude/variants/hmi
    -DSF_VARIANT_HMI
    -DLV_CONF_INCLUDE_SIMPLE
    ; Optional status indication on the 5 WS2812 LEDs around the knob (0 = off).
    -DSF_HMI_LED_RING=1
build_src_filter = ${env.build_src_filter} +<variants/hmi/>
