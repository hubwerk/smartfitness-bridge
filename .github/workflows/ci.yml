name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build and run host tests
        run: make host-tests

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3dev, crowpanel128]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/cache@v4.2.4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-platformio-6.2.0-python-3.12-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-6.2.0-python-3.12-${{ matrix.env }}-
            ${{ runner.os }}-platformio-6.2.0-python-3.12-
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build firmware
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware
        uses: actions/upload-artifact@v4.6.2
        with:
          name: firmware-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/bootloader.bin
            .pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  hmi-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Fetch LVGL v9.2.2
        run: git clone --depth 1 --branch v9.2.2 https://github.com/lvgl/lvgl.git .cache/lvgl
      - name: Render HMI screenshots (knob-only walkthrough included)
        run: bash scripts/update_hmi_docs.sh --check --hmi
        env:
          LVGL_DIR: ${{ github.workspace }}/.cache/lvgl
          SCREENSHOT_DIR: screenshots
          JOBS: '2'
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hmi-screenshots
          path: screenshots/hmi/*.png
          if-no-files-found: error

  web-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install screenshot browser
        run: |
          python -m pip install -r scripts/requirements-screenshots.txt
          python -m playwright install --with-deps chromium
      - name: Render desktop/mobile tabs and check committed gallery
        run: bash scripts/update_hmi_docs.sh --check --web
        env:
          SCREENSHOT_DIR: screenshots
      - name: Upload web screenshots
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: web-screenshots
          path: screenshots/web/*.png
          if-no-files-found: error
