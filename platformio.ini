[env:esp32s3dev]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; Pinned for Arduino-ESP32 core 2.0.17 (NimBLE 2.x needs core 3.x).
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/AsyncTCP@3.5.0
    ESP32Async/ESPAsyncWebServer@3.12.1
extra_scripts = pre:scripts/embed_web_assets.py
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; BLE: FTMS output client + BLE input device (+1 spare) on one NimBLE stack.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
